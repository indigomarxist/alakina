# Rebuilds and deploys the site once a day so the Instagram grid stays current,
# and refreshes the long-lived Instagram token (valid 60 days) on each run.
name: Daily rebuild

on:
  schedule:
    - cron: '0 13 * * *' # 9am New York (EDT)
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh Instagram token
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::warning::INSTAGRAM_ACCESS_TOKEN is not set; the Instagram grid will be hidden."
            exit 0
          fi
          if ! res=$(curl -fsS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$INSTAGRAM_ACCESS_TOKEN"); then
            echo "::warning::Instagram token refresh failed; building with the existing token."
            exit 0
          fi
          new=$(echo "$res" | jq -r '.access_token // empty')
          if [ -n "$new" ] && [ "$new" != "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::add-mask::$new"
            echo "INSTAGRAM_ACCESS_TOKEN=$new" >> "$GITHUB_ENV"
            echo "::warning::Instagram issued a new token string. Update the INSTAGRAM_ACCESS_TOKEN secret (GitHub and Cloudflare)."
          fi
          echo "Token valid for another $(( $(echo "$res" | jq -r '.expires_in // 0') / 86400 )) days."

      - run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
